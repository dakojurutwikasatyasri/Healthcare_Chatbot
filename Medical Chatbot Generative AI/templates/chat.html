<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
          integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>

<body>
<div class="container-fluid h-100">
    <div class="row justify-content-center h-100">
        <div class="col-md-8 col-xl-6 chat">
            <div class="card">
                <div class="card-header msg_head">
                    <div class="d-flex bd-highlight">
                        <div class="img_cont">
                            <!-- Replace this image with your downloaded image -->
                            <img src="{{ url_for('static', filename='images/icon.png') }}"
                                 class="rounded-circle user_img">
                            <span class="online_icon"></span>
                        </div>
                        <div class="user_info">
                            <span>Healthcare Chatbot</span>
                            <p>Ask me anything!</p>
                        </div>
                    </div>
                </div>
                <div id="messageFormeight" class="card-body msg_card_body">
                </div>
                <div class="card-footer">
                    <form id="messageArea" class="input-group">
                        <input type="text" id="text" name="msg" placeholder="What is your Query..." autocomplete="off"
                               class="form-control type_msg" required/>
                        <div class="input-group-append">
                            <button type="submit" id="send" class="input-group-text send_btn"><i
                                    class="fas fa-location-arrow"></i></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Auto-scroll to bottom of chat
        function scrollToBottom() {
            $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
        }

        $("#messageArea").on("submit", function(event) {
            event.preventDefault();

            const date = new Date();
            const hour = date.getHours();
            const minute = date.getMinutes();
            const str_time = hour + ":" + minute;
            var rawText = $("#text").val().trim();

            if (!rawText) return;  // Don't send empty messages

            // Append user message to chat
            var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">' + str_time + '</span></div><div class="img_cont_msg"><img src="{{ url_for('static', filename='images/user.png') }}" class="rounded-circle user_img_msg"></div></div>';
            $("#text").val("");
            $("#messageFormeight").append(userHtml);
            scrollToBottom();

            // Send message to backend
            $.ajax({
                url: "/get",
                type: "POST",
                data: {msg: rawText},
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                success: function(data) {
                    console.log("Response from backend:", data);

                    // Display bot response
                    var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="{{ url_for('static', filename='images/icon.png') }}" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">' + (data.response || data.error) + '<span class="msg_time">' + str_time + '</span></div></div>';
                    $("#messageFormeight").append(botHtml);
                    scrollToBottom();
                },
                error: function(xhr, status, error) {
                    console.error("AJAX error:", error);
                    var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="{{ url_for('static', filename='images/icon.png') }}" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">Sorry, I encountered an error. Please try again.<span class="msg_time">' + str_time + '</span></div></div>';
                    $("#messageFormeight").append(botHtml);
                    scrollToBottom();
                }
            });
        });
    });
</script>

</body>
</html>
